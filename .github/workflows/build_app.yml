name: Build app
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: write # needed to attach assets to a release
      id-token: write # needed to mint the OIDC token for build provenance attestation
      attestations: write # needed to publish the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: pc_dashboard-linux-x86_64
          - os: macos-latest
            asset_name: pc_dashboard-macos-arm64
          - os: macos-26-intel
            asset_name: pc_dashboard-macos-x86_64
          - os: windows-latest
            asset_name: pc_dashboard-windows-x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      # Montage and PhysiCellOutput are registered in the BergmanLabRegistry.
      # Add it (plus General, which must be added explicitly once any
      # registry is added manually) so PackageCompiler can resolve them.
      - name: Add BergmanLabRegistry
        run: >
          julia -e 'import Pkg;
          Pkg.Registry.add("General");
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/drbergman-lab/BergmanLabRegistry.git"))'

      # The CairoMakie/Makie stack is heavy to compile into a sysimage; free
      # up disk headroom on Linux by dropping preinstalled toolchains this
      # workflow never uses (Android SDK, .NET, GHC, ...).
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true

          df -h .

      # Diagnostic only, for tracking down the earlier "signal 15:
      # Terminated" / "operation was canceled" failures on Linux.
      # The monitor prints directly into the build log every 10s so the
      # final snapshots survive even if the runner kills the job.
      - name: Build app with PackageCompiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (
            while true; do
              echo
              echo "=================================================="
              echo "$(date -u +%FT%TZ)"

              echo "--- free ---"
              free -h || true

              echo "--- meminfo ---"
              grep -E 'Mem|Swap' /proc/meminfo || true

              echo "--- cgroup ---"
              for f in \
                /sys/fs/cgroup/memory.current \
                /sys/fs/cgroup/memory.max \
                /sys/fs/cgroup/memory.peak \
                /sys/fs/cgroup/memory/memory.usage_in_bytes \
                /sys/fs/cgroup/memory/memory.limit_in_bytes
              do
                [ -f "$f" ] && {
                  echo "$f"
                  cat "$f"
                }
              done

              echo "--- disk ---"
              df -h .

              echo "--- top RSS ---"
              ps -eo pid,rss,comm --sort=-rss | head -20

              echo "--- julia processes ---"
              ps -o pid,ppid,%mem,%cpu,rss,vsz,etime,args -C julia || true

              echo "--- linker processes ---"
              ps -o pid,ppid,%mem,%cpu,rss,vsz,etime,args -C ld -C ld.lld -C lld || true

              sleep 10
            done
          ) &
          MONITOR_PID=$!

          julia --project=build build/create_app.jl pc_dashboard
          STATUS=$?

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          exit $STATUS

      - name: Build app with PackageCompiler (macOS)
        if: runner.os == 'macOS'
        run: julia --project=build build/create_app.jl pc_dashboard

      - name: Build app with PackageCompiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: julia --project=build build/create_app.jl pc_dashboard

      - name: Copy install.sh (macOS only)
        if: runner.os == 'macOS'
        run: cp build/install.sh .

      - name: Archive app (tar.gz)
        if: runner.os != 'Windows'
        run: |
          if [ -f install.sh ]; then
            tar -czf ${{ matrix.asset_name }}.tar.gz pc_dashboard install.sh
          else
            tar -czf ${{ matrix.asset_name }}.tar.gz pc_dashboard
          fi

      - name: Archive app (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path pc_dashboard -DestinationPath ${{ matrix.asset_name }}.zip

      # Cryptographically ties this archive to the exact commit/workflow
      # run that produced it. Anyone (including us) can verify a
      # downloaded release asset wasn't tampered with after the fact via:
      #   gh attestation verify <file> --repo drbergman-lab/PhysiCellDashboard.jl
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ matrix.asset_name }}.*'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}.zip"; do
            if [ -f "$f" ]; then
              gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
            fi
          done
