name: Build app
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: write # needed to attach assets to a release
      id-token: write # needed to mint the OIDC token for build provenance attestation
      attestations: write # needed to publish the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is intentionally not built here: PackageCompiler's
          # sysimage-link step gets killed by something outside Julia's
          # control (GitHub's own Linux-runner resource monitoring, near as
          # we can tell — see TODO.md) on every standard-runner attempt, a
          # fix that resolved the equivalent failure on Windows had no
          # effect on Linux. Linux users build their own — see the
          # "Building the app yourself" section in README.md.
          - os: macos-latest
            asset_name: pc_dashboard-macos-arm64
          - os: macos-26-intel
            asset_name: pc_dashboard-macos-x86_64
          - os: windows-latest
            asset_name: pc_dashboard-windows-x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      # Montage and PhysiCellOutput are registered in the BergmanLabRegistry.
      # Add it (plus General, which must be added explicitly once any
      # registry is added manually) so PackageCompiler can resolve them.
      - name: Add BergmanLabRegistry
        run: >
          julia -e 'import Pkg;
          Pkg.Registry.add("General");
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/drbergman-lab/BergmanLabRegistry.git"))'

      - name: Build app with PackageCompiler
        run: julia --project=build build/create_app.jl pc_dashboard

      - name: Copy install.sh (macOS only)
        if: runner.os == 'macOS'
        run: cp build/install.sh .

      - name: Archive app (tar.gz)
        if: runner.os == 'macOS'
        run: tar -czf ${{ matrix.asset_name }}.tar.gz pc_dashboard install.sh

      - name: Archive app (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path pc_dashboard -DestinationPath ${{ matrix.asset_name }}.zip

      # Cryptographically ties this archive to the exact commit/workflow
      # run that produced it. Anyone (including us) can verify a
      # downloaded release asset wasn't tampered with after the fact via:
      #   gh attestation verify <file> --repo drbergman-lab/PhysiCellDashboard.jl
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ matrix.asset_name }}.*'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}.zip"; do
            if [ -f "$f" ]; then
              gh release upload "${{ github.event.release.tag_name }}" "$f" --clobber
            fi
          done
